<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>17 — Statement Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; }
  body {
    position:relative; width:1920px; height:1080px;
    background:#103A21; /* Pine ground */
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
  }
  .stage { position:absolute; inset:0; }
  .eyebrow {
    position:absolute; left:100px; top:120px;
    font-size:24px; line-height:1.2; font-weight:500;
    color:#34FF67; text-transform:uppercase; letter-spacing:0.04em;
  }
  .statement {
    position:absolute; left:100px; top:380px; width:1280px;
    font-size:120px; font-weight:900; color:#34FF67;
    line-height:0.90; letter-spacing:-0.025em;
  }
  .marker { position:absolute; }
  .footer { position:absolute; left:0; top:982px; width:1920px; height:98px; }
  .footer .logo { position:absolute; left:100px; top:36px; width:110px; height:auto; }
  .footer .page {
    position:absolute; right:100px; top:40px;
    font-size:16px; font-weight:500; color:rgba(255,255,255,0.8);
    font-variant-numeric: tabular-nums lining-nums;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="eyebrow">Finding &middot; Checkout</div>
    <div class="statement">Checkout doesn&rsquo;t fail.<br>It stops explaining<br>itself, one field<br>before the button.</div>

    <svg class="marker" style="left:1750px; top:150px;" width="20" height="20">
      <circle cx="10" cy="10" r="6" fill="none" stroke="#34FF67" stroke-width="3" opacity="0.7"/>
    </svg>
    <svg class="marker" style="left:1750px; top:850px;" width="20" height="20">
      <line x1="2.8" y1="2.8" x2="17.2" y2="17.2" stroke="#34FF67" stroke-width="2.8" opacity="0.7"/>
      <line x1="17.2" y1="2.8" x2="2.8" y2="17.2" stroke="#34FF67" stroke-width="2.8" opacity="0.7"/>
    </svg>

    <div class="footer">
      <img class="logo" src="../../../logo/colab-wordmark-electric-green.svg" alt="colab.">
      <div class="page">17</div>
    </div>
  </div>
  <script>
    document.fonts.ready.then(function () {
      document.body.setAttribute('data-ready', '1');
    });
  </script>
</body>
</html>
