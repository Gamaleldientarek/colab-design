<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>02 — Big Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; }
  body {
    position:relative; width:1920px; height:1080px;
    background:#103A21; /* Pine Green / Jade ground */
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
  }
  .stage { position:absolute; inset:0; }
  .eyebrow {
    position:absolute; left:100px; top:120px;
    font-size:24px; line-height:1.2; font-weight:500;
    color:#34FF67; text-transform:uppercase; letter-spacing:0.04em;
  }
  .numeral {
    position:absolute; left:320px; top:220px; width:1080px;
    font-size:560px; font-weight:900; color:#FFFFFF;
    line-height:0.90; letter-spacing:-0.025em;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .label {
    position:absolute; left:320px; top:788px;
    font-size:28px; font-weight:600; color:#FFFFFF;
    line-height:1.35; letter-spacing:-0.011em;
  }
  .comparison {
    position:absolute; left:320px; top:840px;
    font-size:20px; font-weight:500; color:#FF5A32;
    line-height:1.35; letter-spacing:-0.011em;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .footer { position:absolute; left:0; top:982px; width:1920px; height:98px; }
  .footer .logo { position:absolute; left:100px; top:36px; width:110px; height:auto; }
  .footer .page {
    position:absolute; right:100px; top:40px;
    font-size:16px; font-weight:500; color:rgba(255,255,255,0.8);
    font-variant-numeric: tabular-nums lining-nums;
  }
  .motif-field { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; }
</style>
</head>
<body>
  <div class="stage">
    <div class="eyebrow">Checkout Testing &middot; Round 2</div>
    <div class="numeral">62%</div>
    <div class="label">failed checkout</div>
    <div class="comparison">+21 pts vs round 1</div>
    <div class="footer">
      <img class="logo" src="../../logo/colab-wordmark-electric-green.svg" alt="colab.">
      <div class="page">02</div>
    </div>
    <div class="motif-field" id="field"></div>
  </div>
  <script src="../../motif/motif.js"></script>
  <script>
    document.fonts.ready.then(function () {
      ColabMotif.renderDitherField(document.getElementById('field'),
        { x: 1640, y: 120, w: 280, h: 780 },
        { dir: 'right', targetFill: 0.22, color: '#34FF67', opacity: 0.55, seed: 2, markerEvery: 9 });
      document.body.setAttribute('data-ready', '1');
    });
  </script>
</body>
</html>
